[package]
name = "yoake-hook-codemod"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "yoake-hook-codemod"
path = "src/main.rs"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut", "extra-traits"] }
yoake-callsite-match = { path = "../yoake-callsite-match" }
yoake-hook-ledger = { path = "../yoake-hook-ledger" }

[lints]
workspace = true
