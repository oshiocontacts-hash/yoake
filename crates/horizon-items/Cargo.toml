[package]
name = "horizon-items"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.90"
description = "Blocks and items as the client knows them: block facts, item stacks and their data components, enchantments, cooldowns, bundles, and items in NBT"

[dependencies]
yoake-hook-macro = { path = "../yoake-hook-macro" }
yoake-hook-rt = { path = "../yoake-hook-rt" }
horizon-client-core = { path = "../horizon-client-core" }
horizon-core = { path = "../horizon-core" }
yoake-inject-macro = { path = "../yoake-inject-macro" }
yoake-inject-rt = { path = "../yoake-inject-rt" }
horizon-world = { path = "../horizon-world" }
serde = { version = "1", features = ["derive"] }
log = "0.4"
serde_json = { version = "1.0.151", features = ["raw_value"] }
# MX3G1: the wire codec and the hook-argument receiver of the generated glue (feature `yoake2-slice` only).
yoake-slice = { path = "../yoake-slice", optional = true }

[features]
# MX3G1: compiles the generated binding glue (src/yoake_glue) into the items module. Off by default.
yoake2-slice = ["dep:yoake-slice"]
yoake-callsite-baseline = []
# Test helpers (`Items::for_tests`, `enchant::tests`) for horizon-client's unit tests.
test-support = []

[build-dependencies]
yoake-hook-ledger = { path = "../yoake-hook-ledger" }

[lints]
workspace = true
