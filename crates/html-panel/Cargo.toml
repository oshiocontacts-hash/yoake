[package]
name = "html-panel"
version = "0.1.0"
edition = "2024"
publish = false
description = "Draw an HTML page with a headless Chrome/Edge and hand the pixels and messages to a Horizon mod"

[dependencies]
base64 = "0.22.1"
serde_json = "1.0.151"
png = "0.18.1"
zune-jpeg = "0.4.21"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
