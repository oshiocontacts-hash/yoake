[package]
name = "yoake-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
horizon-client-core = { path = "../horizon-client-core" }
horizon-items = { path = "../horizon-items" }
horizon-world = { path = "../horizon-world" }
serde_json = "1.0.151"
wasmtime = { version = "=48.0.7", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }

wasmtime-wasi = { version = "=48.0.7", default-features = false, features = ["p2"] }
bytes = { version = "1", default-features = false }
tokio = { version = "1", default-features = false }

[features]
# Test support: finds and builds the example guests (`test_guests`).
test-guests = []

[dev-dependencies]
yoake-wasm = { path = ".", features = ["test-guests"] }
wit-component = { version = "0.254", features = ["dummy-module"] }
wit-parser = "0.254"

[lints]
workspace = true
