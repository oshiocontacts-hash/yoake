[package]
name = "yoake-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
horizon-client-core = { path = "../horizon-client-core" }
horizon-items = { path = "../horizon-items" }
horizon-mods = { path = "../horizon-mods", features = ["yak"] }
horizon-world = { path = "../horizon-world" }
serde_json = "1.0.151"
toml = "1.1.6"
yoake-inject-rt = { path = "../yoake-inject-rt" }
yoake-value = { path = "../yoake-value" }
wasmtime = { version = "=48.0.7", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }

wasmtime-wasi = { version = "=48.0.7", default-features = false, features = ["p1", "p2"] }
wasmtime-wasi-http = { version = "=48.0.7", default-features = false, features = ["p2", "default-send-request"] }
yoake-mod-io = { path = "../yoake-mod-io" }
http = "1"
bytes = { version = "1", default-features = false }
tokio = { version = "1", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[features]
# Test support: finds and builds the example guests (`test_guests`).
test-guests = []

[dev-dependencies]
yoake-wasm = { path = ".", features = ["test-guests"] }
wit-component = { version = "0.254", features = ["dummy-module"] }
wit-parser = "0.254"

[lints]
workspace = true
