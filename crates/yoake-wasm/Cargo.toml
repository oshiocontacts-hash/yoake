[package]
name = "yoake-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
wasmtime = { version = "=48.0.7", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }

wasmtime-wasi = { version = "=48.0.7", default-features = false, features = ["p2"] }
bytes = { version = "1", default-features = false }
tokio = { version = "1", default-features = false }

[dev-dependencies]
wit-component = { version = "0.254", features = ["dummy-module"] }
wit-parser = "0.254"

[lints]
workspace = true
