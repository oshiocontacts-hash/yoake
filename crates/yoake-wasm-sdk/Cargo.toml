[package]
name = "yoake-wasm-sdk"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Guest SDK for Yoake WebAssembly client mods (wasm32-wasip2)"

[features]
default = ["std", "runtime"]
# Normal Rust `std` guests (wasi:cli, wasi:io, wasi:clocks, wasi:random, stdout/stderr go to the mod's
# log). Turn it off (`default-features = false, features = ["runtime"]`) for a `#![no_std]` mod.
std = []
# Global allocator + panic handler for the #![no_std] guest; ignored with `std`.
runtime = []
# Typed bindings of the full hook catalog (`client-full` and `server-full` worlds): `yoake_wasm_sdk::full`.
# Off by default: the bindings are large and only needed by full-catalog mods.
full = []

[dependencies]
yoake-wasm-test-macros = { path = "test-macros" }
# default features off: the SDK decides about std itself.
wit-bindgen = { version = "=0.57.1", default-features = false, features = ["realloc", "macros"] }

# Guest crate: built on its own for wasm32-wasip2, never by the host workspace.
[workspace]
