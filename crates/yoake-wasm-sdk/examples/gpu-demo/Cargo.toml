[package]
name = "yoake-wasm-gpu-demo"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
verify = []
reload = ["verify"]
trap = ["verify"]

[dependencies]
yoake-wasm-sdk = { path = "../..", features = ["full"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[workspace]
