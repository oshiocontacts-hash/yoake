format = 1
id = "f2-check"
version = "0.1.0"
name = "F2 Check"
authors = ["Yoake"]
description = "FR-REM05: files, HTTP POST, TCP and a non-blocking worker, checked in a real game by tools/f2_e2e.py."

[yoake]
