format = 1
id = "server-storage"
version = "0.1.0"
name = "Server Storage Visits Demo"
authors = ["Yoake SDK Examples"]
description = "Server-side WebAssembly example that tracks a per-player /visits counter using the storage service."
license = "MIT"

[yoake]
version = ">=0.1"

[side]
client = false
server = true
required_on_join = false

[wasm]
interface = "1.0"
server = "bin/wasm/server-storage.wasm"
permissions = ["service.storage"]
