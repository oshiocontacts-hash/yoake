format = 1
id = "mod-call-responder"
version = "0.1.0"
name = "Mod Call Responder Demo"
authors = ["Yoake SDK Examples"]
description = "Server-side WebAssembly example that answers mod-call requests from mod-call-caller."
license = "MIT"

[yoake]
version = ">=0.1"

[side]
client = false
server = true
required_on_join = false

[wasm]
interface = "1.0"
server = "bin/wasm/mod-call-responder.wasm"
permissions = []
