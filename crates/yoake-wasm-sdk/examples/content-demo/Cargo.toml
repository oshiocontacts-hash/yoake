[package]
name = "yoake-wasm-content-demo"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Content demo: a block, an item, an effect, a recipe, a loot table, a mob and a sound as data, and a small server module that reacts to the mob"

[lib]
crate-type = ["cdylib"]

[dependencies]
yoake-wasm-sdk = { path = "../..", features = ["full"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[workspace]
