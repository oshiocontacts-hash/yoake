[package]
name = "yoake-wasm-full-demo"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Full-catalog demo: a client module (HUD commands, hides the hotbar) and a server module (/wasmping)"

[lib]
crate-type = ["cdylib"]

[features]
# Build once per world and keep both files:
#   cargo build --release --target wasm32-wasip2 --features client   -> the client-full module
#   cargo build --release --target wasm32-wasip2 --features server   -> the server-full module
client = ["dep:yoake-wasm-sdk"]
server = ["dep:yoake-wasm-sdk"]
#   cargo build --release --target wasm32-wasip2 --features peer     -> a second package that answers mod-call
peer = ["dep:yoake-wasm-sdk"]
#   cargo build --release --target wasm32-wasip2 --features client-peer -> a client-full package that answers client mod-call
client-peer = ["dep:yoake-wasm-sdk"]

[dependencies]
yoake-wasm-sdk = { path = "../..", features = ["full"], optional = true }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"

[workspace]
