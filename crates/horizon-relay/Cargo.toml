[package]
name = "horizon-relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Play with friends' relay: hands out invite codes, introduces hosts and guests, relays the encrypted stream when a direct connection fails"

[dependencies]
horizon-friends = { path = "../horizon-friends" }
getrandom = "0.3"
serde_json = "1.0.151"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
ring = "0.17"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[[bin]]
name = "horizon-relay"
path = "src/main.rs"

[lints]
workspace = true
