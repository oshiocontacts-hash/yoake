name: yoake-windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'yoake-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      YOAKE_VERSION: ${{ vars.YOAKE_VERSION }}
      YOAKE_FEED_URL: ${{ vars.YOAKE_FEED_URL }}
      YOAKE_PORTAL_URL: ${{ vars.YOAKE_PORTAL_URL }}
      YOAKE_FEED_SOURCE_ID: ${{ vars.YOAKE_FEED_SOURCE_ID }}
      HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
      YOAKE_PUBLIC_KEYS: ${{ vars.YOAKE_PUBLIC_KEYS }}
      HORIZON_VERSION: ${{ vars.YOAKE_VERSION }}
      HORIZON_LAUNCHER_VERSION: ${{ vars.YOAKE_VERSION }}
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - name: Validate public build configuration
        shell: pwsh
        run: |
          $required = @(
            'YOAKE_VERSION', 'YOAKE_FEED_URL', 'YOAKE_PORTAL_URL',
            'YOAKE_FEED_SOURCE_ID', 'HORIZON_MSA_CLIENT_ID', 'YOAKE_PUBLIC_KEYS'
          )
          $missing = @($required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($missing.Count -gt 0) {
            throw "Missing required repository variables: $($missing -join ', ')"
          }
          $keys = @($env:YOAKE_PUBLIC_KEYS -split '\r?\n|\r' | ForEach-Object {
            $_.Trim()
          } | Where-Object { $_ -and -not $_.StartsWith('#') })
          if ($keys.Count -eq 0) {
            throw 'YOAKE_PUBLIC_KEYS must contain at least one public key line.'
          }
          $keyFile = Join-Path $env:RUNNER_TEMP 'yoake-public-keys.txt'
          $utf8 = [Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText($keyFile, $env:YOAKE_PUBLIC_KEYS, $utf8)
          [IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "YOAKE_PUBLIC_KEYS_FILE=$keyFile`nYOAKE_COMPILED_PUBLIC_KEYS=$($keys -join ';')`n",
            $utf8
          )

      - uses: dtolnay/rust-toolchain@stable

      - name: Locate Windows SDK shader compiler
        shell: pwsh
        run: |
          if (-not (Get-Command fxc.exe -ErrorAction SilentlyContinue)) {
            $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $fxc = Get-ChildItem -Path $sdkBin -Filter fxc.exe -File -Recurse |
              Where-Object { $_.Directory.Name -eq 'x64' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $fxc) {
              throw 'fxc.exe was not found in the Windows SDK.'
            }
            $fxc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build launcher
        run: cargo build --release --locked --manifest-path launcher/Cargo.toml

      - name: Build plain game client
        run: cargo build --release --locked -p horizon-client --bin horizon-client

      - name: Stage unsigned binaries and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath 'launcher/target/release/horizon-launcher.exe' -Destination 'dist/YoakeLauncher.exe'
          Copy-Item -LiteralPath 'target/release/horizon-client.exe' -Destination 'dist/yoake.exe'
          $hashes = foreach ($file in @('YoakeLauncher.exe', 'yoake.exe')) {
            $hash = (Get-FileHash -LiteralPath (Join-Path 'dist' $file) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          [IO.File]::WriteAllLines(
            (Join-Path $PWD 'dist/SHA256SUMS'),
            [string[]]$hashes,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Upload unsigned artifact
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: yoake-windows-unsigned
          path: dist/
          if-no-files-found: error

      # TODO(SignPath): pass steps.unsigned.outputs.artifact-id to the SignPath
      # action once the owner supplies the organization and project settings.
