name: yoake-windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'yoake-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      YOAKE_VERSION: ${{ vars.YOAKE_VERSION }}
      YOAKE_FEED_URL: ${{ vars.YOAKE_FEED_URL }}
      YOAKE_PORTAL_URL: ${{ vars.YOAKE_PORTAL_URL }}
      YOAKE_FEED_SOURCE_ID: ${{ vars.YOAKE_FEED_SOURCE_ID }}
      HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
      YOAKE_PUBLIC_KEYS: ${{ vars.YOAKE_PUBLIC_KEYS }}
      HORIZON_VERSION: ${{ vars.YOAKE_VERSION }}
      HORIZON_LAUNCHER_VERSION: ${{ vars.YOAKE_VERSION }}
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - name: Validate public build configuration
        shell: pwsh
        run: |
          $required = @(
            'YOAKE_VERSION', 'YOAKE_FEED_URL', 'YOAKE_PORTAL_URL',
            'YOAKE_FEED_SOURCE_ID', 'HORIZON_MSA_CLIENT_ID', 'YOAKE_PUBLIC_KEYS'
          )
          $missing = @($required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($missing.Count -gt 0) {
            throw "Missing required repository variables: $($missing -join ', ')"
          }
          $keys = @($env:YOAKE_PUBLIC_KEYS -split '\r?\n|\r' | ForEach-Object {
            $_.Trim()
          } | Where-Object { $_ -and -not $_.StartsWith('#') })
          if ($keys.Count -eq 0) {
            throw 'YOAKE_PUBLIC_KEYS must contain at least one public key line.'
          }
          $keyFile = Join-Path $env:RUNNER_TEMP 'yoake-public-keys.txt'
          $utf8 = [Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText($keyFile, $env:YOAKE_PUBLIC_KEYS, $utf8)
          [IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "YOAKE_PUBLIC_KEYS_FILE=$keyFile`nYOAKE_COMPILED_PUBLIC_KEYS=$($keys -join ';')`n",
            $utf8
          )

      - uses: dtolnay/rust-toolchain@stable

      - name: Locate Windows SDK shader compiler
        shell: pwsh
        run: |
          if (-not (Get-Command fxc.exe -ErrorAction SilentlyContinue)) {
            $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
            $fxc = Get-ChildItem -Path $sdkBin -Filter fxc.exe -File -Recurse |
              Where-Object { $_.Directory.Name -eq 'x64' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $fxc) {
              throw 'fxc.exe was not found in the Windows SDK.'
            }
            $fxc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Build launcher
        run: cargo build --release --locked --manifest-path launcher/Cargo.toml

      - name: Build plain game client
        run: cargo build --release --locked -p horizon-client --bin horizon-client
        # Social features are built into the game from these repository variables (values are
        # public keys and host names, set in Settings > Variables). Empty: social is disabled.
        env:
          YOAKE_SOCIAL_PORTAL_KEY: ${{ vars.YOAKE_SOCIAL_PORTAL_KEY }}
          YOAKE_SOCIAL_RELAY_CA: ${{ vars.YOAKE_SOCIAL_RELAY_CA }}
          YOAKE_SOCIAL_RELAY_CA_SHA256: ${{ vars.YOAKE_SOCIAL_RELAY_CA_SHA256 }}
          YOAKE_SOCIAL_RELAYS: ${{ vars.YOAKE_SOCIAL_RELAYS }}

      - name: Stage unsigned binaries and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -LiteralPath 'launcher/target/release/horizon-launcher.exe' -Destination 'dist/YoakeLauncher.exe'
          Copy-Item -LiteralPath 'target/release/horizon-client.exe' -Destination 'dist/yoake.exe'
          Copy-Item -LiteralPath 'LICENSE' -Destination 'dist/LICENSE'
          Copy-Item -LiteralPath 'THIRD_PARTY_NOTICES.md' -Destination 'dist/THIRD_PARTY_NOTICES.md'
          Copy-Item -LiteralPath 'packaging/windows/README.txt' -Destination 'dist/README.txt'
          $hashes = foreach ($file in @('YoakeLauncher.exe', 'yoake.exe', 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'README.txt')) {
            $hash = (Get-FileHash -LiteralPath (Join-Path 'dist' $file) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file"
          }
          [IO.File]::WriteAllLines(
            (Join-Path $PWD 'dist/SHA256SUMS'),
            [string[]]$hashes,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Upload unsigned artifact
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: yoake-windows-unsigned
          path: dist/
          if-no-files-found: error

      # TODO(SignPath): pass steps.unsigned.outputs.artifact-id to the SignPath
      # action once the owner supplies the organization and project settings.

  msix:
    needs: build
    runs-on: windows-latest
    env:
      YOAKE_DISTRIBUTION: store
      YOAKE_VERSION: ${{ vars.YOAKE_VERSION }}
      YOAKE_FEED_URL: ${{ vars.YOAKE_FEED_URL }}
      YOAKE_PORTAL_URL: ${{ vars.YOAKE_PORTAL_URL }}
      YOAKE_FEED_SOURCE_ID: ${{ vars.YOAKE_FEED_SOURCE_ID }}
      HORIZON_MSA_CLIENT_ID: ${{ vars.HORIZON_MSA_CLIENT_ID }}
      YOAKE_PUBLIC_KEYS: ${{ vars.YOAKE_PUBLIC_KEYS }}
      HORIZON_VERSION: ${{ vars.YOAKE_VERSION }}
      HORIZON_LAUNCHER_VERSION: ${{ vars.YOAKE_VERSION }}
      YOAKE_MSIX_IDENTITY_NAME: ${{ vars.YOAKE_MSIX_IDENTITY_NAME }}
      YOAKE_MSIX_PUBLISHER: ${{ vars.YOAKE_MSIX_PUBLISHER }}
      YOAKE_MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.YOAKE_MSIX_PUBLISHER_DISPLAY_NAME }}
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - name: Validate Store configuration
        shell: pwsh
        run: |
          $required = @(
            'YOAKE_MSIX_IDENTITY_NAME', 'YOAKE_MSIX_PUBLISHER',
            'YOAKE_MSIX_PUBLISHER_DISPLAY_NAME', 'YOAKE_VERSION',
            'YOAKE_FEED_URL', 'YOAKE_PORTAL_URL', 'YOAKE_FEED_SOURCE_ID',
            'HORIZON_MSA_CLIENT_ID', 'YOAKE_PUBLIC_KEYS'
          )
          $missing = @($required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($missing.Count -gt 0) {
            throw "Missing required MSIX repository variables: $($missing -join ', '). Set the identity fields from Partner Center Product identity."
          }
          if ($env:YOAKE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw 'YOAKE_VERSION must be a three-part numeric version (a.b.c) for MSIX.'
          }
          foreach ($part in $env:YOAKE_VERSION.Split('.')) {
            [uint64]$number = 0
            if (-not [uint64]::TryParse($part, [ref]$number) -or $number -gt 65535) {
              throw 'Each YOAKE_VERSION component must be between 0 and 65535 for MSIX.'
            }
          }
          $keys = @($env:YOAKE_PUBLIC_KEYS -split '\r?\n|\r' | ForEach-Object {
            $_.Trim()
          } | Where-Object { $_ -and -not $_.StartsWith('#') })
          if ($keys.Count -eq 0) {
            throw 'YOAKE_PUBLIC_KEYS must contain at least one public key line.'
          }
          $keyFile = Join-Path $env:RUNNER_TEMP 'yoake-public-keys.txt'
          $utf8 = [Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText($keyFile, $env:YOAKE_PUBLIC_KEYS, $utf8)
          [IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "YOAKE_PUBLIC_KEYS_FILE=$keyFile`nYOAKE_COMPILED_PUBLIC_KEYS=$($keys -join ';')`nYOAKE_MSIX_VERSION=$($env:YOAKE_VERSION).0`n",
            $utf8
          )

      - uses: dtolnay/rust-toolchain@stable

      - name: Locate Windows SDK tools
        shell: pwsh
        run: |
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          foreach ($tool in @('fxc.exe', 'makeappx.exe')) {
            if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) {
              $found = Get-ChildItem -Path $sdkBin -Filter $tool -File -Recurse |
                Where-Object { $_.Directory.Name -eq 'x64' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1
              if (-not $found) {
                throw "$tool was not found in the Windows SDK."
              }
              $found.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Build Store launcher
        run: cargo build --release --locked --manifest-path launcher/Cargo.toml

      - name: Build plain game client
        run: cargo build --release --locked -p horizon-client --bin horizon-client
        # Social features are built into the game from these repository variables (values are
        # public keys and host names, set in Settings > Variables). Empty: social is disabled.
        env:
          YOAKE_SOCIAL_PORTAL_KEY: ${{ vars.YOAKE_SOCIAL_PORTAL_KEY }}
          YOAKE_SOCIAL_RELAY_CA: ${{ vars.YOAKE_SOCIAL_RELAY_CA }}
          YOAKE_SOCIAL_RELAY_CA_SHA256: ${{ vars.YOAKE_SOCIAL_RELAY_CA_SHA256 }}
          YOAKE_SOCIAL_RELAYS: ${{ vars.YOAKE_SOCIAL_RELAYS }}

      - name: Generate Store logos
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Installing Pillow failed.' }
          $stage = Join-Path $env:RUNNER_TEMP 'yoake-msix-staging'
          python packaging/msix/make_logos.py packaging/icons/yoake-256.png (Join-Path $stage 'Assets')
          if ($LASTEXITCODE -ne 0) { throw 'Generating MSIX logos failed.' }

      - name: Pack unsigned MSIX
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'yoake-msix-staging'
          Copy-Item -LiteralPath 'launcher/target/release/horizon-launcher.exe' -Destination (Join-Path $stage 'YoakeLauncher.exe')
          Copy-Item -LiteralPath 'target/release/horizon-client.exe' -Destination (Join-Path $stage 'yoake.exe')
          Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $stage 'LICENSE')
          Copy-Item -LiteralPath 'THIRD_PARTY_NOTICES.md' -Destination (Join-Path $stage 'THIRD_PARTY_NOTICES.md')
          $manifest = Get-Content -LiteralPath 'packaging/msix/AppxManifest.xml.in' -Raw
          $manifest = $manifest.Replace('@IDENTITY_NAME@', [Security.SecurityElement]::Escape($env:YOAKE_MSIX_IDENTITY_NAME))
          $manifest = $manifest.Replace('@PUBLISHER@', [Security.SecurityElement]::Escape($env:YOAKE_MSIX_PUBLISHER))
          $manifest = $manifest.Replace('@PUBLISHER_DISPLAY_NAME@', [Security.SecurityElement]::Escape($env:YOAKE_MSIX_PUBLISHER_DISPLAY_NAME))
          $manifest = $manifest.Replace('@VERSION@', $env:YOAKE_MSIX_VERSION)
          [IO.File]::WriteAllText((Join-Path $stage 'AppxManifest.xml'), $manifest, [Text.UTF8Encoding]::new($false))
          python packaging/msix/check_assets.py (Join-Path $stage 'AppxManifest.xml') (Join-Path $stage 'Assets')
          if ($LASTEXITCODE -ne 0) { throw 'MSIX manifest assets are missing.' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & makeappx.exe pack /d $stage /p "dist/Yoake-$($env:YOAKE_VERSION)-x64.msix" /o
          if ($LASTEXITCODE -ne 0) { throw 'makeappx.exe failed to create the MSIX package.' }

      - name: Upload unsigned Store package
        uses: actions/upload-artifact@v4
        with:
          name: yoake-msix
          path: dist/*.msix
          if-no-files-found: error
